name: CI/CD Pipeline

# When should this run?
on:
  push:
    branches: [main, testing, dev]
  pull_request:
    branches: [main, testing, dev]

jobs:
  # Job 1: check the code works
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm # reuses downloaded packages from the last run, so installs are faster

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations match the schema
        # Generates a migration from schema.ts. If that creates a new file, someone changed
        # the schema but forgot to run db:generate, so this step fails.
        # Renaming a column or table makes db:generate ask a question, which CI can't answer,
        # so the timeout stops it instead of hanging. Generate renames on your machine.
        timeout-minutes: 3
        run: |
          pnpm --filter @saas/api db:generate
          git status --porcelain apps/api/migrations
          test -z "$(git status --porcelain apps/api/migrations)"
        env:
          # db:generate doesn't connect to a database, but drizzle.config.ts needs a value
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Job 2: check every Docker image still builds (runs at the same time as Job 1)
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build the images
        run: docker compose build

  # Job 3: put the new code on the server
