# If another proxy sits in front of this nginx and handles https (Caddy, Cloudflare,
# a load balancer), it sends "X-Forwarded-Proto: https". Keep that value, so the API
# knows the visitor used https. Without one, use this request's own scheme (http or https).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Send API requests to the api container (like the Vite proxy does in dev)
  location /api/ {
    proxy_pass http://api:3000;

    # Tell the API about the original request, which it can't see behind nginx:
    # the site's hostname and port, the visitor's IP, and whether they used http or https.
    # The API reads these because app.ts sets "trust proxy" (needed for secure cookies).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Let React handle every other URL
  location / {
    try_files $uri /index.html;
  }
}
